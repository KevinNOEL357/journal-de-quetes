<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal de quêtes</title>
  <!-- Les polices : Cinzel (titres gravés) et EB Garamond (texte de vieux livre) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Pour l'installation sur téléphone (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141110">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quêtes">
</head>
<body>
  <div class="app">
    <!-- Le héros : nom (touche pour changer), synchro, cœurs, niveau, barre d'XP -->
    <section id="heros">
      <div class="ligne-heros">
        <button id="joueur">🛡️ Joueur 1</button>
        <button id="renommer" title="Changer le nom">✎</button>
        <button id="nuage" title="Synchro">☁</button>
        <span id="coeurs">♥ 0</span>
        <span id="niveau">NIV. 1</span>
      </div>
      <div class="barre"><span id="barre-xp"></span></div>
      <div id="texte-xp"></div>
    </section>

    <!-- Le rappel du jour + les boutons Installer / Rappels -->
    <section id="rappel" class="cache"></section>
    <div id="actions">
      <button id="installer" class="cache">📲 Installer l'appli</button>
      <button id="activer-rappels" class="cache">🔔 Activer les rappels</button>
    </div>

    <!-- Le titre de la section choisie, ses sous-onglets, puis son contenu -->
    <h1 class="titre-page"><span id="titre-icone"></span> <span id="titre-nom"></span></h1>
    <nav id="sous" class="sous"></nav>
    <button id="ajouter" class="bouton">⚔ Nouvelle quête</button>
    <div id="contenu"></div>
  </div>

  <!-- La roue (cachée au départ) -->
  <div id="roue-fond" class="cache">
    <p class="roue-titre">⚔ JOURNAL DE QUÊTES ⚔</p>
    <p class="aide">Touche une part</p>
    <svg id="roue" viewBox="0 0 375 375"></svg>
  </div>

  <!-- Le sceau rouge qui ouvre/ferme la roue -->
  <button id="bouton-roue">⚔</button>

  <!-- Le petit message "+25 XP" -->
  <div id="toast"></div>

  <!-- Le panneau pour ajouter ou modifier une quête -->
  <div id="panneau-quete" class="modale cache">
    <form id="formulaire" class="panneau" autocomplete="off">
      <button type="button" class="fermer" data-fermer>✕</button>
      <h3 id="form-titre">Nouvelle quête</h3>

      <label data-pour="calendrier">Type
        <select id="f-type">
          <option value="rdv">📅 Rendez-vous</option>
          <option value="sorties">🎉 Sortie / événement</option>
          <option value="ponctuel">📌 Tâche ponctuelle</option>
        </select>
      </label>
      <label data-pour="routines loisirs travaux"><span id="f-sous-label">Catégorie</span>
        <select id="f-sous"></select>
      </label>
      <label><span id="f-titre-label">Quête</span>
        <input id="f-titre" required>
      </label>
      <div class="deux" data-pour="courses">
        <label>Quantité <input id="f-quantite" inputmode="numeric" placeholder="1"></label>
        <label>Rayon <select id="f-rayon"></select></label>
      </div>
      <label data-pour="routines">🔁 Tous les combien de jours ?
        <input id="f-delai" type="number" min="1" inputmode="numeric">
      </label>
      <div class="deux" data-pour="calendrier loisirs travaux">
        <label><span id="f-date-label">Date</span> <input id="f-date" type="date"></label>
        <label data-pour="calendrier">Heure <input id="f-heure" type="time"></label>
      </div>
      <label data-pour="calendrier">Lieu (facultatif) <input id="f-lieu"></label>
      <label data-pour="routines calendrier travaux attentions"><span id="f-qui-label">Qui s'en charge</span>
        <select id="f-qui"></select>
      </label>
      <div data-pour="calendrier loisirs" class="bloc-rappel">
        <label class="coche"><input id="f-rappel" type="checkbox"> 🔔 <span id="f-rappel-label">Me rappeler</span></label>
        <select id="f-avant" data-pour="calendrier">
          <option value="15">15 min avant</option>
          <option value="60">1 h avant</option>
          <option value="1440">la veille</option>
        </select>
      </div>
      <button type="submit" class="bouton">⚔ Enregistrer</button>
      <button type="button" id="f-agenda" class="bouton fer" data-pour="calendrier loisirs">📅 Ajouter à l'agenda du téléphone</button>
      <button type="button" id="f-supprimer" class="bouton discret">🗑 Supprimer cette quête</button>
    </form>
  </div>

  <!-- Le panneau de la synchro (étape 5) -->
  <div id="panneau-cloud" class="modale cache">
    <div class="panneau">
      <button id="fermer-panneau" class="fermer" title="Fermer">✕</button>
      <h3>☁ Synchro du foyer</h3>
      <div id="panneau-corps"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
  <script src="sync.js"></script>
</body>
</html>
