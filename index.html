<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal de quêtes</title>
  <link rel="stylesheet" href="style.css">
  <!-- Pour l'installation sur téléphone (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b2a1a">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Quêtes">
</head>
<body>
  <div class="app">
    <!-- Le héros : nom (touche pour changer), cœurs, niveau, barre d'XP -->
    <section id="heros">
      <div class="ligne-heros">
        <button id="joueur">🛡️ Joueur 1</button>
        <button id="renommer" title="Changer le nom">✏️</button>
        <span id="coeurs">❤️ 0</span>
        <span id="niveau">Niveau 1</span>
      </div>
      <div class="barre"><span id="barre-xp"></span></div>
      <div id="texte-xp"></div>
    </section>

    <!-- Le rappel du jour + les boutons Installer / Rappels -->
    <section id="rappel" class="cache"></section>
    <div id="actions">
      <button id="installer" class="cache">📲 Installer l'appli</button>
      <button id="activer-rappels" class="cache">🔔 Activer les rappels</button>
    </div>

    <!-- En-tête : la thématique choisie -->
    <header>
      <span id="theme-icone">☀️</span>
      <h1 id="theme-nom">Jour</h1>
    </header>

    <!-- Formulaire pour ajouter une quête -->
    <form id="formulaire">
      <input id="champ-titre" placeholder="Nouvelle quête…" autocomplete="off" required>
      <select id="champ-qui"></select> <!-- rempli par app.js avec les noms des joueurs -->
      <button type="submit">＋</button>
      <div class="options">
        <label>🔁 tous les <input id="champ-delai" type="number" min="1" inputmode="numeric"> jours</label>
        <label>📆 <input id="champ-date" type="date"></label>
      </div>
    </form>

    <!-- La liste des quêtes (remplie par app.js) -->
    <ul id="liste"></ul>
    <p id="vide">Aucune quête ici. Ajoute-en une !</p>
  </div>

  <!-- La roue (cachée au départ) -->
  <div id="roue-fond" class="cache">
    <p class="aide">Touche une part</p>
    <svg id="roue" viewBox="0 0 375 375"></svg>
  </div>

  <!-- Le gros bouton rond qui ouvre/ferme la roue -->
  <button id="bouton-roue">⚔️</button>

  <!-- Le petit message "+25 XP" -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
